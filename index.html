<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f1115"><title>GNV Parking Navigator</title><meta name="description" content="Live GPS-guided Gainesville street-parking search using City of Gainesville GIS data."><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>
*{box-sizing:border-box}html,body,#app{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#0f1115;color:#fff}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:340px 1fr;height:100%}.side{background:#151820;border-right:1px solid #2c3340;padding:14px;overflow:auto;z-index:600}.brand{font-size:20px;font-weight:800}.sub{font-size:12px;color:#9ba5b4;margin:3px 0 12px}.row{display:flex;gap:8px;margin:8px 0}.row>*{min-width:0}.field{display:grid;gap:5px;margin:8px 0}.field label{font-size:12px;color:#9ba5b4}input,select,.btn{min-height:44px;border:1px solid #303846;border-radius:11px;background:#1e232d;color:#fff;padding:10px}.grow{flex:1}.btn{font-weight:750}.primary{background:#367df5;border-color:#367df5}.green{background:#1b8e66;border-color:#1b8e66}.danger{background:#41242a;border-color:#6c3a43}.pill{display:inline-block;font-size:12px;color:#b8c1ce;border:1px solid #354052;border-radius:999px;padding:5px 8px;margin:4px 4px 0 0}.status{font-size:12px;color:#9ba5b4;line-height:1.5;margin-top:8px}.card{border:1px solid #303846;border-radius:12px;padding:10px;margin:8px 0;background:#1b2029}.card b{display:block}.meta{font-size:12px;color:#9ba5b4;margin-top:3px;line-height:1.35}.mapwrap{position:relative;min-width:0}.map{height:100%;width:100%}.nav{position:absolute;z-index:700;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));background:rgba(18,22,29,.96);border:1px solid #3b70c8;border-radius:14px;padding:12px;display:none;box-shadow:0 10px 30px #0008}.nav.show{display:block}.navbig{font-size:20px;font-weight:850}.navsmall{font-size:12px;color:#b5beca;margin-top:4px}.mapbtn{position:absolute;right:14px;z-index:710;width:48px;height:48px;border-radius:50%;background:#171c24;color:#fff;border:1px solid #354052;font-size:22px;box-shadow:0 6px 18px #0007}.locbtn{bottom:82px}.stopbtn{bottom:22px}.notice{position:absolute;z-index:720;bottom:20px;left:50%;transform:translateX(-50%);max-width:calc(100% - 30px);background:#171c24;border:1px solid #354052;border-radius:12px;padding:9px 12px;font-size:12px;display:none}.notice.show{display:block}.num{background:#367df5;color:#fff;border:2px solid #fff;border-radius:50%;width:28px!important;height:28px!important;line-height:24px;text-align:center;font-weight:800}.puck{width:24px;height:24px;border-radius:50%;background:#2b7cff;border:4px solid #fff;box-shadow:0 0 0 7px #2b7cff33}.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#151820;color:#fff}@media(max-width:820px){.app{display:flex;flex-direction:column}.mapwrap{height:60%;min-height:390px;order:1}.side{order:2;border:0;border-top:1px solid #2c3340}.nav{top:max(12px,env(safe-area-inset-top))}}
</style></head><body><main id="app" class="app"><aside class="side"><div class="brand">GNV Parking Navigator</div><div class="sub">Live GPS route through Gainesville street parking</div><form id="destForm" class="row"><input id="dest" class="grow" value="Infinity Hall, Gainesville, FL" aria-label="Destination"><button class="btn primary">Go</button></form><div class="row"><button id="gps" class="btn grow" type="button">◎ Use my location</button><button id="find" class="btn primary grow" type="button">Find route</button></div><div class="field"><label for="zone">Permit zone</label><select id="zone"><option value="none">No permit</option><option value="1">Zone 1</option><option value="2">Zone 2</option><option value="6">Zone 6</option><option value="7">Zone 7</option><option value="8">Zone 8</option><option value="12">Zone 12</option></select></div><div class="row"><label><input id="free" type="checkbox" checked> Free</label><label><input id="permit" type="checkbox" checked> Permit</label><label><input id="paid" type="checkbox" checked> Paid/timed</label></div><div class="field"><label for="count">Segments to scan</label><select id="count"><option>15</option><option selected>25</option><option>40</option><option>60</option></select></div><div class="row"><button id="start" class="btn green grow" type="button" disabled>▶ Start GPS navigation</button></div><div class="row"><button id="next" class="btn grow" type="button" disabled>Skip segment</button><button id="found" class="btn green grow" type="button" disabled>✓ Found spot</button></div><div><span id="data" class="pill">Loading City GIS…</span><span id="gpsstat" class="pill">GPS idle</span></div><div id="routeInfo" class="status">Choose your permit zone, tap <b>Use my location</b>, then <b>Find route</b>. The route drives along each eligible parking curb so you can scan for an opening.</div><div id="list"></div></aside><section class="mapwrap"><div id="map" class="map"></div><div id="nav" class="nav"><div id="navbig" class="navbig">Navigation ready</div><div id="navsmall" class="navsmall"></div></div><button id="recenter" class="mapbtn locbtn" type="button" aria-label="Recenter">◎</button><button id="stop" class="mapbtn stopbtn" type="button" aria-label="Stop navigation">■</button><div id="notice" class="notice"></div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>
(()=>{const S='https://services2.arcgis.com/Zzhtlau4ccHkQgTu/ArcGIS/rest/services/On_Street_Parking_Nov_25_2024/FeatureServer/0/query',SF='https://services2.arcgis.com/Zzhtlau4ccHkQgTu/ArcGIS/rest/services/Gainesville_Parking_Map_6_August_2024_WFL1/FeatureServer/2/query',G='https://geocode.arcgis.com/arcgis/rest/services/World/GeocodeServer/findAddressCandidates',R='https://router.project-osrm.org/route/v1/driving/',INF={lat:29.64865,lng:-82.33535,label:'Infinity Hall'};const $=id=>document.getElementById(id),map=L.map('map',{preferCanvas:true}).setView([INF.lat,INF.lng],15);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:20,attribution:'© OpenStreetMap contributors'}).addTo(map);const st={dest:INF,data:null,layer:null,cands:[],route:[],idx:0,routeLine:null,navLine:null,marks:[],user:null,userMark:null,watch:null,lastRoute:0};let nt;function note(t,ms=4500){$('notice').textContent=t;$('notice').classList.add('show');clearTimeout(nt);nt=setTimeout(()=>$('notice').classList.remove('show'),ms)}function low(v){return String(v??'').toLowerCase()}function key(f){return f.properties?.FID??f.properties?.OBJECTID??Math.random()}function name(f){const p=f.properties||{};return p.location_1||p.segmentlab||p.location||'Street parking'}function zone(f){return String(f.properties?.enforczone||'').replace(/\D/g,'')}function cat(f){const r=low(f.properties?.restrictio),s=low(f.properties?.spacetype);if(r.includes('no parking')||r.includes('reserved')||r.includes('loading')||r.includes('ada')||s.includes('ada'))return'no';if(r.includes('permit'))return'permit';if(r.includes('$')||r.includes('paid')||r.includes('payment'))return'paid';if(r.includes('time')||r.includes('hour')||r.includes('min'))return'timed';if(r.includes('free'))return'free';return'mixed'}function allowed(f){const c=cat(f);if(c==='no')return false;if(c==='free')return $('free').checked;if(c==='permit'){if(!$('permit').checked)return false;const z=$('zone').value;const grace=(()=>{const d=new Date(),m=d.getMonth()+1,x=d.getDate();return(m===7&&x>=15)||m===8})();return grace||z!=='none'&&(!zone(f)||zone(f)===z)}return $('paid').checked}function coords(f){const g=f.geometry;if(!g)return[];return g.type==='LineString'?g.coordinates:g.type==='MultiLineString'?g.coordinates.flat():[]}function ends(f){const c=coords(f);if(!c.length)return null;return{a:L.latLng(c[0][1],c[0][0]),b:L.latLng(c.at(-1)[1],c.at(-1)[0])}}function mid(f){const c=coords(f);if(!c.length)return null;let x=0,y=0;for(const q of c){x+=q[0];y+=q[1]}return L.latLng(y/c.length,x/c.length)}function color(f){return({free:'#35c48d',permit:'#a98df5',paid:'#56a8ff',timed:'#f2bd49',mixed:'#f39b55',no:'#ee6464'})[cat(f)]}function style(f){return{color:color(f),weight:allowed(f)?6:3,opacity:allowed(f)?.9:.18,lineCap:'round'}}function popup(f){const p=f.properties||{};return`<b>${name(f)}</b><br>${p.restrictio||cat(f)}${zone(f)?` · Zone ${zone(f)}`:''}${p.spaces?` · ${p.spaces} mapped spaces`:''}<br><small>Verify posted signs before parking.</small>`}async function qgis(url){const q=new URLSearchParams({where:'1=1',outFields:'FID,OBJECTID,location,spaces,spacetype,operdays,operhours,parkdur,restrictio,otherparkr,notes,enforczone,location_1,segmentlab',returnGeometry:'true',outSR:'4326',f:'geojson',resultRecordCount:'2000'}),r=await fetch(url+'?'+q);if(!r.ok)throw Error(r.status);const d=await r.json();if(!d.features)throw Error('bad data');return d}async function load(){try{try{st.data=await qgis(S)}catch{st.data=await qgis(SF)};st.layer=L.geoJSON(st.data,{style,onEachFeature:(f,l)=>l.bindPopup(popup(f))}).addTo(map);$('data').textContent=`${st.data.features.length} City segments`;note('Official Gainesville parking segments loaded.')}catch(e){$('data').textContent='City GIS failed';note('Could not load Gainesville parking GIS.',7000)}}function refresh(){if(st.layer)st.layer.setStyle(style)}function rank(){return st.data.features.filter(allowed).map(f=>({f,m:mid(f)})).filter(x=>x.m&&map.distance([st.dest.lat,st.dest.lng],x.m)<5000).sort((a,b)=>map.distance([st.dest.lat,st.dest.lng],a.m)-map.distance([st.dest.lat,st.dest.lng],b.m))}function order(items,n,start){const pool=items.slice(0,100),out=[],used=new Set;let cur=start;while(out.length<Math.min(n,pool.length)){let bi=-1,bd=1e9;pool.forEach((x,i)=>{if(used.has(i))return;const d=cur.distanceTo(x.m)+map.distance([st.dest.lat,st.dest.lng],x.m)*.18;if(d<bd){bd=d;bi=i}});if(bi<0)break;const x=pool[bi],e=ends(x.f);if(!e){used.add(bi);return}const entry=cur.distanceTo(e.a)<=cur.distanceTo(e.b)?e.a:e.b,exit=entry===e.a?e.b:e.a;out.push({...x,entry,exit});used.add(bi);cur=exit}return out}async function osrm(points,steps=false){const u=R+points.map(p=>`${p.lng},${p.lat}`).join(';')+`?overview=full&geometries=geojson&steps=${steps}`;const r=await fetch(u);if(!r.ok)throw Error('route');const d=await r.json();if(!d.routes?.[0])throw Error('route');return d.routes[0]}function clear(){if(st.routeLine)map.removeLayer(st.routeLine);if(st.navLine)map.removeLayer(st.navLine);st.routeLine=st.navLine=null;st.marks.forEach(m=>map.removeLayer(m));st.marks=[]}async function build(){if(!st.data)return note('Parking data is still loading.');st.cands=rank();if(!st.cands.length)return note('No parking segments match those filters.');clear();const start=st.user||L.latLng(st.dest.lat,st.dest.lng);st.route=order(st.cands,+$('count').value,start);st.idx=0;st.route.forEach((x,i)=>{const icon=L.divIcon({className:'num',html:i+1,iconSize:[28,28],iconAnchor:[14,14]});st.marks.push(L.marker(x.m,{icon}).addTo(map).bindPopup(`<b>Search stop ${i+1}</b><br>${popup(x.f)}`))});const pts=[start,...st.route.flatMap(x=>[x.entry,x.exit])];try{const chunks=[];for(let i=0;i<pts.length-1;i+=18)chunks.push(pts.slice(i,Math.min(i+19,pts.length)));const fs=[];for(const c of chunks){const r=await osrm(c);fs.push({type:'Feature',properties:{},geometry:r.geometry})}st.routeLine=L.geoJSON({type:'FeatureCollection',features:fs},{style:{color:'#367df5',weight:6,opacity:.7}}).addTo(map)}catch{st.routeLine=L.polyline(pts,{color:'#367df5',weight:5,dashArray:'7 7'}).addTo(map)}map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:16});$('start').disabled=$('next').disabled=$('found').disabled=false;updateInfo();renderList();note(st.user?'Route starts from your GPS location.':'Route built from destination; use GPS before starting navigation.')}function renderList(){$('list').innerHTML=st.route.slice(0,12).map((x,i)=>`<div class="card"><b>${i+1}. ${name(x.f)}</b><div class="meta">${x.f.properties?.restrictio||cat(x.f)}${zone(x.f)?` · Zone ${zone(x.f)}`:''}</div></div>`).join('')}function updateInfo(){const x=st.route[st.idx];if(!x)return;$('routeInfo').innerHTML=`<b>Segment ${st.idx+1}/${st.route.length}:</b> ${name(x.f)}<br>Drive from one end of the mapped curb to the other and scan for an open space.`;$('navbig').textContent=`Next: ${name(x.f)}`;$('navsmall').textContent=`Segment ${st.idx+1} of ${st.route.length}`}
async function geocode(q){if(low(q).includes('infinity hall'))q='978 SW 2nd Ave, Gainesville, FL 32601';const p=new URLSearchParams({SingleLine:q,f:'json',maxLocations:'5',countryCode:'USA',searchExtent:'-82.45,29.57,-82.245,29.735'}),r=await fetch(G+'?'+p),d=await r.json(),c=d.candidates?.[0];if(!c)throw Error('not found');return{lat:c.location.y,lng:c.location.x,label:c.address}}async function setDest(e){e.preventDefault();try{st.dest=await geocode($('dest').value.trim());map.flyTo([st.dest.lat,st.dest.lng],16);note(`Destination: ${st.dest.label}`)}catch{note('Destination not found. Try a Gainesville street address.',6000)}}function pos(p,center=false){st.user=L.latLng(p.coords.latitude,p.coords.longitude);$('gpsstat').textContent=`GPS ±${Math.round(p.coords.accuracy)}m`;if(!st.userMark)st.userMark=L.marker(st.user,{icon:L.divIcon({className:'',html:'<div class="puck"></div>',iconSize:[24,24],iconAnchor:[12,12]}),zIndexOffset:1200}).addTo(map);else st.userMark.setLatLng(st.user);if(center)map.flyTo(st.user,18)}function gps(center=true){return new Promise((ok,bad)=>{if(!navigator.geolocation)return bad();navigator.geolocation.getCurrentPosition(p=>{pos(p,center);ok(p)},e=>{note(!window.isSecureContext?'GPS requires HTTPS. Deploy on Vercel and reopen the site.':'Location permission was denied or unavailable.',7000);bad(e)},{enableHighAccuracy:true,timeout:12000,maximumAge:2000})})}function instr(step){if(!step)return'Continue';const m=step.maneuver||{},n=step.name?` onto ${step.name}`:'';if(m.type==='turn')return`Turn ${m.modifier||''}${n}`;if(m.type==='arrive')return'Arrive at parking segment';return`Continue${n}`}async function liveRoute(force=false){if(!st.user||!st.route.length)return;const now=Date.now();if(!force&&now-st.lastRoute<9000)return;st.lastRoute=now;const x=st.route[st.idx],de=st.user.distanceTo(x.entry),dx=st.user.distanceTo(x.exit),inside=de<65||dx<65;let pts=inside?[st.user,x.exit]:[st.user,x.entry,x.exit];try{const r=await osrm(pts,true);if(st.navLine)map.removeLayer(st.navLine);st.navLine=L.geoJSON(r.geometry,{style:{color:'#1473ff',weight:8,opacity:.95}}).addTo(map);const steps=(r.legs||[]).flatMap(l=>l.steps||[]),s=steps.find(a=>a.maneuver?.type!=='depart'&&a.distance>8)||steps[0];$('navbig').textContent=inside?`Scan ${name(x.f)}`:instr(s);$('navsmall').textContent=inside?`${Math.round(dx*3.28084)} ft to end · segment ${st.idx+1}/${st.route.length}`:`${Math.max(1,Math.round(r.duration/60))} min · then scan ${name(x.f)}`;if(inside&&dx<40)next(true);map.panTo(st.user,{animate:true,duration:.25})}catch{$('navbig').textContent=`Continue to ${name(x.f)}`;$('navsmall').textContent=`${Math.round(de*3.28084)} ft to segment`}}async function start(){try{if(!st.route.length)await build();if(!st.user)await gps(false)}catch{return}$('nav').classList.add('show');$('start').disabled=true;if(st.watch!==null)navigator.geolocation.clearWatch(st.watch);st.watch=navigator.geolocation.watchPosition(p=>{pos(p);liveRoute()},()=>{}, {enableHighAccuracy:true,maximumAge:1000,timeout:15000});liveRoute(true)}function stop(){if(st.watch!==null)navigator.geolocation.clearWatch(st.watch);st.watch=null;if(st.navLine)map.removeLayer(st.navLine);st.navLine=null;$('nav').classList.remove('show');$('start').disabled=!st.route.length}async function next(auto=false){if(!st.route.length)return;if(st.idx<st.route.length-1){st.idx++;updateInfo();if(st.watch!==null)liveRoute(true)}else if(!auto)note('End of planned route. Increase “Segments to scan” and rebuild.')}function found(){const x=st.route[st.idx];stop();note(`Parking found near ${x?name(x.f):'current segment'}. Verify posted signage before leaving your car.`,9000)}$('destForm').addEventListener('submit',setDest);$('gps').addEventListener('click',()=>gps(true).catch(()=>{}));$('find').addEventListener('click',build);$('start').addEventListener('click',start);$('next').addEventListener('click',()=>next(false));$('found').addEventListener('click',found);$('recenter').addEventListener('click',()=>st.user?map.flyTo(st.user,18):gps(true).catch(()=>{}));$('stop').addEventListener('click',stop);['zone','free','permit','paid','count'].forEach(id=>$(id).addEventListener('change',()=>{stop();clear();refresh();$('start').disabled=$('next').disabled=$('found').disabled=true}));if(!window.isSecureContext)note('Live GPS needs HTTPS. Vercel will provide this automatically.',7000);load()})();
